name: Bug report / 問題回報
description: Report incorrect statistics, diff results, or interface problems. 回報統計、比對結果或介面的問題。
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste private or sensitive text. 請勿貼上私人或敏感內容。
  - type: textarea
    id: problem
    attributes:
      label: What happened? / 發生了什麼事？
      description: Describe the problem and what you expected instead. 說明問題以及你預期的結果。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 重現步驟
      description: Include a minimal sample text and the options you enabled. 附上最小的範例文字與勾選的選項。
      placeholder: |
        1. Paste `...` on the left
        2. Paste `...` on the right
        3. Enable "Ignore whitespace"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS / 瀏覽器與作業系統
      placeholder: Chrome on macOS
    validations:
      required: true
